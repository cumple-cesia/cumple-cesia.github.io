<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumpleaños de Cesia</title>
<meta name="description" content="Estás invitado al cumpleaños número 7 de Cesia · 7 de noviembre, 11 AM · Finca La Herradura">
<meta name="theme-color" content="#fbd3e4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --rosa-claro: #fde4ef;
    --rosa: #f5a8c9;
    --rosa-medio: #ee86b3;
    --rosa-fuerte: #d9548f;
    --rosa-tinta: #a8336a;
    --menta: #c8ece6;
    --blanco: #ffffff;
    --sombra: 196, 70, 126;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #fff1f7; scroll-behavior: smooth; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    color: var(--rosa-tinta);
    background: #fff1f7;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Fondo fijo: degradado, lunares y halo ---------- */
  .fondo {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 45% at 50% 42%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(120% 90% at 50% 0%, #fff7fb 0%, #fde2ee 55%, #f9c9de 100%);
  }
  .fondo::before {
    content: ""; position: absolute; inset: -40px;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.9) 0 3px, transparent 3.5px),
      radial-gradient(circle, rgba(238,134,179,.18) 0 2.5px, transparent 3px);
    background-size: 46px 46px, 46px 46px;
    background-position: 0 0, 23px 23px;
    -webkit-mask: radial-gradient(85% 70% at 50% 50%, transparent 30%, #000 85%);
            mask: radial-gradient(85% 70% at 50% 50%, transparent 30%, #000 85%);
    transform: translateY(calc(var(--scroll, 0) * -60px));
  }

  /* ---------- Recorrido con scroll ---------- */
  .recorrido { height: 440vh; position: relative; }
  .escena {
    position: sticky; top: 0;
    height: 100vh; height: 100svh;
    display: grid; place-items: center;
    perspective: 2200px;
    overflow: hidden;
  }

  /* Globos que suben al fondo */
  .globos { position: absolute; inset: 0; pointer-events: none; }
  .globo {
    position: absolute; bottom: -140px;
    width: var(--t, 46px); aspect-ratio: 5 / 6;
    border-radius: 50% 50% 48% 52% / 55% 55% 45% 45%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,0) 26%), var(--c, var(--rosa));
    box-shadow: inset -6px -8px 14px rgba(var(--sombra), .22);
    opacity: .55;
    animation: subir var(--d, 22s) linear infinite;
    animation-delay: var(--r, 0s);
  }
  .globo::after {
    content: ""; position: absolute; left: 50%; top: 100%;
    width: 1.5px; height: 70px; background: linear-gradient(rgba(var(--sombra), .35), transparent);
    transform: translateX(-50%);
  }
  .globo::before {
    content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    border: 5px solid transparent; border-bottom: 6px solid var(--c, var(--rosa)); border-top: 0;
  }
  @keyframes subir {
    0%   { transform: translate(0, 0) rotate(-4deg); }
    50%  { transform: translate(18px, -60vh) rotate(4deg); }
    100% { transform: translate(-10px, -125vh) rotate(-3deg); }
  }

  /* Destellos en forma de estrella */
  .destellos { position: absolute; inset: 0; pointer-events: none; }
  .destellos i {
    position: absolute; width: 14px; height: 14px;
    background: #fff;
    clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    filter: drop-shadow(0 0 4px rgba(238,134,179,.9));
    animation: titilar 3.2s ease-in-out infinite;
  }
  @keyframes titilar {
    0%, 100% { transform: scale(.3) rotate(0); opacity: 0; }
    50% { transform: scale(1) rotate(45deg); opacity: 1; }
  }

  /* Encabezado sobre la carta */
  .encabezado {
    position: absolute; top: max(14px, 3.2svh); left: 0; right: 0;
    text-align: center; pointer-events: none;
    transition: opacity .5s, transform .5s;
  }
  .encabezado .script {
    font-family: "Pacifico", cursive; font-size: clamp(20px, 3.4vh, 30px);
    color: var(--rosa-fuerte);
    text-shadow: 0 2px 0 #fff, 0 6px 18px rgba(var(--sombra), .25);
  }
  .oculto { opacity: 0; transform: translateY(-10px); }

  /* ---------- La carta ---------- */
  .halo {
    position: absolute; width: min(120vh, 140vw); aspect-ratio: 1;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(253,210,229,.5) 35%, transparent 65%);
    opacity: calc(.55 + var(--abierto, 0) * .45);
    transform: scale(calc(.85 + var(--abierto, 0) * .25));
    pointer-events: none;
  }
  .carta {
    position: relative;
    height: min(76svh, 640px);
    aspect-ratio: 459 / 520;
    max-width: 84vw;
    margin-top: 4svh;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .carta img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }

  .interior { position: absolute; inset: 0; }
  .interior img { filter: drop-shadow(0 22px 34px rgba(var(--sombra), .28)); }
  .interior::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(120, 30, 70, .4), transparent 75%);
    -webkit-mask: url(interior.png) center / contain no-repeat;
            mask: url(interior.png) center / contain no-repeat;
    opacity: var(--sombra-int, 1);
    pointer-events: none;
  }

  .portada {
    position: absolute; top: 0;
    left: -5.01%; width: 110.02%; height: 100%;
    transform-origin: 0% 50%;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .cara {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    opacity: var(--opacidad, 1);
  }
  .cara.frente { transform: translateZ(1px); }
  .cara.frente img { filter: drop-shadow(0 24px 36px rgba(var(--sombra), .32)); }
  .cara.frente::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.6) 48%, transparent 66%);
    background-size: 260% 100%;
    background-position: var(--brillo, 120%) 0;
    -webkit-mask: url(portada.png) center / contain no-repeat;
            mask: url(portada.png) center / contain no-repeat;
    pointer-events: none;
  }
  /* Reverso: papel rosa con lunares, moño y nombre */
  .cara.reverso {
    transform: rotateY(180deg) translateZ(1px);
    background:
      radial-gradient(circle, rgba(255,255,255,.85) 0 3px, transparent 3.5px) 0 0 / 30px 30px,
      radial-gradient(circle, rgba(255,255,255,.5) 0 2px, transparent 2.5px) 15px 15px / 30px 30px,
      linear-gradient(160deg, #fde6f0 0%, #f8bcd6 55%, #f1a0c4 100%);
    -webkit-mask: url(portada.png) center / contain no-repeat;
            mask: url(portada.png) center / contain no-repeat;
    display: grid; place-items: center;
  }
  .reverso-contenido {
    display: grid; justify-items: center; gap: 4px;
    background: rgba(255,255,255,.72);
    padding: 7% 12% 8%;
    border-radius: 28px;
    box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 0 0 7px rgba(238,134,179,.35);
    color: var(--rosa-fuerte);
    text-align: center;
  }
  .reverso-contenido svg { width: clamp(54px, 10vh, 86px); }
  .reverso-contenido .nombre { font-family: "Pacifico", cursive; font-size: clamp(34px, 7vh, 60px); line-height: 1.2; }
  .reverso-contenido .edad { font-weight: 600; letter-spacing: .2em; font-size: clamp(13px, 2vh, 17px); }

  /* Indicador de deslizar */
  .pista {
    position: absolute; bottom: max(16px, env(safe-area-inset-bottom), 2.6svh); left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    font-weight: 500; font-size: 15px;
    background: rgba(255,255,255,.85);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    padding: 9px 18px 9px 12px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(var(--sombra), .2), inset 0 0 0 1.5px rgba(238,134,179,.35);
    transition: opacity .4s, transform .4s;
    white-space: nowrap;
  }
  .raton {
    width: 20px; height: 30px; border: 2px solid var(--rosa-fuerte); border-radius: 12px; position: relative;
  }
  .raton::after {
    content: ""; position: absolute; left: 50%; top: 6px; width: 4px; height: 7px; margin-left: -2px;
    border-radius: 2px; background: var(--rosa-fuerte);
    animation: rueda 1.6s ease-in-out infinite;
  }
  @keyframes rueda { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(9px); opacity: 0; } 100% { opacity: 0; } }

  /* Barra de progreso tipo listón */
  .progreso {
    position: absolute; right: max(14px, 2vw); top: 50%; transform: translateY(-50%);
    width: 6px; height: 120px; border-radius: 6px; background: rgba(255,255,255,.7);
    box-shadow: inset 0 0 0 1px rgba(238,134,179,.3);
    overflow: hidden;
  }
  .progreso b { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--abierto, 0) * 100%); background: linear-gradient(var(--rosa), var(--rosa-fuerte)); border-radius: 6px; }

  /* Confeti y corazones al abrir */
  .confeti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .confeti span { position: absolute; top: -24px; opacity: 0; }
  .confeti .papel { width: 8px; height: 13px; border-radius: 2px; }
  .confeti .corazon { font-size: 18px; line-height: 1; color: var(--rosa-medio); }
  .abierta .confeti span { animation: caer var(--d, 3s) cubic-bezier(.25,.6,.45,1) var(--r, 0s) forwards; }
  @keyframes caer {
    0% { opacity: 1; transform: translate(0, 0) rotate(0); }
    100% { opacity: 0; transform: translate(var(--x, 0px), 112svh) rotate(var(--g, 540deg)); }
  }

  /* ---------- Sección final ---------- */
  .final {
    position: relative;
    padding: 40px 16px 70px;
    display: grid; justify-items: center; gap: 28px;
  }
  .panel {
    width: min(560px, 100%);
    background: rgba(255,255,255,.88);
    border-radius: 32px;
    padding: 34px 22px 30px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(var(--sombra), .18), 0 0 0 2px #fff, 0 0 0 7px rgba(245,168,201,.35);
    position: relative;
  }
  .panel .mono { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); width: 74px; }
  .panel h2 {
    font-family: "Pacifico", cursive; font-weight: 400;
    font-size: clamp(28px, 7vw, 40px); color: var(--rosa-fuerte); line-height: 1.3;
  }
  .panel .sub { margin-top: 4px; color: #b25a85; font-size: 17px; }

  .cuenta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 24px 0 8px; }
  .cuenta div {
    background: linear-gradient(180deg, #fff, var(--rosa-claro));
    border-radius: 18px; padding: 12px 4px 10px;
    box-shadow: inset 0 0 0 1.5px rgba(238,134,179,.35), 0 6px 14px rgba(var(--sombra), .1);
  }
  .cuenta b { display: block; font-size: clamp(26px, 7vw, 36px); font-weight: 700; color: var(--rosa-fuerte); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cuenta small { font-size: 13px; color: #b25a85; letter-spacing: .04em; }
  .cuenta-fin { margin: 22px 0 6px; font-size: 20px; font-weight: 600; color: var(--rosa-fuerte); }

  .datos { display: grid; gap: 10px; margin: 22px 0 24px; text-align: left; }
  .dato {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 14px; border-radius: 18px; background: #fff7fb;
    box-shadow: inset 0 0 0 1.5px rgba(238,134,179,.25);
  }
  .dato .ic {
    flex: none; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
    background: linear-gradient(160deg, var(--rosa), var(--rosa-medio)); color: #fff;
    box-shadow: 0 6px 14px rgba(var(--sombra), .25);
  }
  .dato .ic svg { width: 22px; height: 22px; }
  .dato small { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #c0789b; }
  .dato strong { font-weight: 600; font-size: 17px; color: var(--rosa-tinta); }

  .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer;
    font: 600 16px "Fredoka", sans-serif; text-decoration: none;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.primario { color: #fff; background: linear-gradient(160deg, var(--rosa-medio), var(--rosa-fuerte)); box-shadow: 0 10px 22px rgba(var(--sombra), .35); }
  .btn.secundario { color: var(--rosa-fuerte); background: #fff; box-shadow: inset 0 0 0 2px var(--rosa); }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--rosa-fuerte); outline-offset: 3px; }

  .despedida { font-family: "Pacifico", cursive; color: var(--rosa-fuerte); font-size: 22px; text-align: center; }
  .volver { background: none; border: 0; font: 500 15px "Fredoka", sans-serif; color: #b25a85; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }

  .aparecer { opacity: 0; transform: translateY(26px); transition: opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
  .aparecer.visible { opacity: 1; transform: none; }

  @media (max-width: 420px) {
    .botones { grid-template-columns: 1fr; }
    .progreso { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .globo, .destellos i, .raton::after { animation: none; }
    .globo { display: none; }
    .aparecer { opacity: 1; transform: none; transition: none; }
  }
</style>
</head>
<body>

<div class="fondo" aria-hidden="true"></div>

<!-- Moño reutilizable -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mono" viewBox="0 0 120 70">
    <path d="M60 35 C 40 8, 8 2, 6 22 C 4 42, 30 58, 60 35 Z" fill="#f7b3cf" stroke="#e2679c" stroke-width="3"/>
    <path d="M60 35 C 80 8, 112 2, 114 22 C 116 42, 90 58, 60 35 Z" fill="#f7b3cf" stroke="#e2679c" stroke-width="3"/>
    <path d="M22 22 C 30 22, 44 28, 52 34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M98 22 C 90 22, 76 28, 68 34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <path d="M52 40 L 40 66 L 52 60 L 58 68 L 60 42 Z M68 40 L 80 66 L 68 60 L 62 68 L 60 42 Z" fill="#f29cc1" stroke="#e2679c" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="49" y="25" width="22" height="20" rx="9" fill="#ee86b3" stroke="#e2679c" stroke-width="3"/>
  </symbol>
</svg>

<section class="recorrido" id="recorrido">
  <div class="escena" id="escena">
    <div class="globos" id="globos" aria-hidden="true"></div>
    <div class="destellos" id="destellos" aria-hidden="true"></div>
    <div class="halo" aria-hidden="true"></div>

    <header class="encabezado" id="encabezado">
      <p class="script">Tienes una invitación especial</p>
    </header>

    <div class="carta" id="carta">
      <div class="interior">
        <img src="interior.png" alt="Celebremos juntos un feliz cumpleaños. Ubicación: Finca La Herradura. Hora: 11 AM. Fecha: 7 de noviembre. ¡Ven a celebrar este día tan especial!">
      </div>
      <div class="portada" id="portada">
        <div class="cara frente">
          <img src="portada.png" alt="Estás invitado al cumpleaños de Cesia, 7 años">
        </div>
        <div class="cara reverso" aria-hidden="true">
          <div class="reverso-contenido">
            <svg viewBox="0 0 120 70"><use href="#mono"/></svg>
            <span class="nombre">Cesia</span>
            <span class="edad">CUMPLE 7 AÑOS</span>
          </div>
        </div>
      </div>
    </div>

    <div class="progreso" aria-hidden="true"><b></b></div>
    <div class="pista" id="pista"><span class="raton" aria-hidden="true"></span>Desliza para abrir tu invitación</div>
    <div class="confeti" id="confeti" aria-hidden="true"></div>
  </div>
</section>

<section class="final" id="final">
  <article class="panel aparecer">
    <svg class="mono" viewBox="0 0 120 70" aria-hidden="true"><use href="#mono"/></svg>
    <h2>¡No faltes!</h2>
    <p class="sub">Cesia cumple 7 años y quiere celebrarlo contigo</p>

    <div class="cuenta" id="cuenta" aria-live="off">
      <div><b data-u="d">0</b><small>días</small></div>
      <div><b data-u="h">0</b><small>horas</small></div>
      <div><b data-u="m">0</b><small>min</small></div>
      <div><b data-u="s">0</b><small>seg</small></div>
    </div>

    <div class="datos">
      <div class="dato">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
        <div><small>Fecha</small><strong>Sábado 7 de noviembre</strong></div>
      </div>
      <div class="dato">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <div><small>Hora</small><strong>11:00 de la mañana</strong></div>
      </div>
      <div class="dato">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
        <div><small>Lugar</small><strong>Finca La Herradura</strong></div>
      </div>
    </div>

    <div class="botones">
      <a class="btn primario" href="https://www.google.com/maps/search/?api=1&query=Finca%20La%20Herradura" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>
        Cómo llegar
      </a>
      <button class="btn secundario" id="calendario" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>
        Agendar
      </button>
    </div>
  </article>

  <p class="despedida aparecer">¡Te esperamos con mucho cariño!</p>
  <button class="volver aparecer" id="volver" type="button">Ver la invitación otra vez</button>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const recorrido = $('recorrido'), escena = $('escena'), carta = $('carta'),
        portada = $('portada'), pista = $('pista'), encabezado = $('encabezado');
  const raiz = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const azar = (a, b) => a + Math.random() * (b - a);

  // Globos del fondo
  const coloresGlobo = ['#f5a8c9', '#ffffff', '#ee86b3', '#fbd1e2', '#c8ece6', '#f7c6da'];
  for (let i = 0; i < 12; i++) {
    const g = document.createElement('span');
    g.className = 'globo';
    g.style.left = (i / 12) * 94 + azar(0, 6) + '%';
    g.style.setProperty('--t', azar(30, 62) + 'px');
    g.style.setProperty('--c', coloresGlobo[i % coloresGlobo.length]);
    g.style.setProperty('--d', azar(18, 30) + 's');
    g.style.setProperty('--r', -azar(0, 30) + 's');
    $('globos').appendChild(g);
  }
  // Destellos
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('i');
    s.style.left = azar(2, 98) + '%';
    s.style.top = azar(4, 96) + '%';
    s.style.animationDelay = -azar(0, 3.2) + 's';
    s.style.animationDuration = azar(2.4, 4.2) + 's';
    const t = azar(8, 16); s.style.width = s.style.height = t + 'px';
    $('destellos').appendChild(s);
  }
  // Confeti y corazones
  const confeti = $('confeti');
  const colores = ['#f5a8c9', '#d9548f', '#ffffff', '#fbd1e2', '#c8ece6', '#ee86b3'];
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('span');
    const corazon = i % 6 === 0;
    s.className = corazon ? 'corazon' : 'papel';
    if (corazon) s.textContent = '♥';
    else s.style.background = colores[i % colores.length];
    s.style.left = azar(0, 100) + '%';
    s.style.setProperty('--r', azar(0, 1) + 's');
    s.style.setProperty('--d', azar(2.4, 4.2) + 's');
    s.style.setProperty('--x', azar(-80, 80) + 'px');
    s.style.setProperty('--g', azar(-720, 720) + 'deg');
    confeti.appendChild(s);
  }

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const tramo = (p, a, b) => clamp((p - a) / (b - a));

  let objetivo = 0, actual = 0, abierta = false;

  function leerScroll() {
    const total = recorrido.offsetHeight - innerHeight;
    objetivo = clamp(-recorrido.getBoundingClientRect().top / total);
    raiz.style.setProperty('--scroll', (scrollY / innerHeight).toFixed(3));
  }

  function pintar(p) {
    // 0–0.08 quieta · 0.08–0.78 se abre · resto: reposo abierta
    const a = ease(tramo(p, 0.08, 0.78));
    const ancho = carta.offsetWidth;
    // Si caben las dos caras lado a lado se centra el conjunto; si no, el interior
    const caben = innerWidth > ancho * 2.15;
    const desplazar = caben ? ancho / 2 : 0;
    // Pequeño "levantar" a mitad de la apertura
    const levantar = Math.sin(Math.PI * a) * -14;
    const inclinar = (1 - a) * 7;
    const escala = 0.93 + 0.07 * a;

    carta.style.transform =
      `translate3d(${desplazar * a}px, ${levantar}px, 0) rotateX(${inclinar}deg) scale(${escala})`;
    portada.style.transform = `rotateY(${-180 * a}deg)`;
    // (opacity va en las caras: en .portada aplanaría el 3D)
    portada.style.setProperty('--opacidad', caben ? 1 : (1 - tramo(a, 0.7, 1) * 0.88).toFixed(3));

    carta.style.setProperty('--sombra-int', (1 - a).toFixed(3));
    portada.style.setProperty('--brillo', (120 - 140 * tramo(a, 0, 0.5)) + '%');
    escena.style.setProperty('--abierto', a.toFixed(3));

    pista.style.opacity = p > 0.03 ? 0 : 1;
    pista.style.transform = `translateX(-50%) translateY(${p > 0.03 ? 12 : 0}px)`;
    encabezado.classList.toggle('oculto', p > 0.05);

    const yaAbierta = a > 0.98;
    if (yaAbierta !== abierta) {
      abierta = yaAbierta;
      escena.classList.toggle('abierta', abierta);
    }
  }

  function ciclo() {
    actual += (objetivo - actual) * (reduce ? 1 : 0.12);
    if (Math.abs(objetivo - actual) < 0.0005) actual = objetivo;
    pintar(actual);
    requestAnimationFrame(ciclo);
  }

  addEventListener('scroll', leerScroll, { passive: true });
  addEventListener('resize', leerScroll);
  leerScroll();
  actual = objetivo;
  ciclo();

  // Aparición de la sección final
  const io = new IntersectionObserver(entradas => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll('.aparecer').forEach(el => io.observe(el));

  // Cuenta regresiva (hora de Guatemala, UTC-6)
  const fiesta = new Date('2026-11-07T11:00:00-06:00');
  const cuenta = $('cuenta');
  const celdas = Object.fromEntries([...cuenta.querySelectorAll('b')].map(b => [b.dataset.u, b]));
  function tic() {
    let ms = fiesta - Date.now();
    if (ms <= 0) {
      const fin = Date.now() - fiesta < 8 * 3600e3 ? '¡Hoy es el gran día! 🎉' : '¡Gracias por celebrar con Cesia! 💖';
      cuenta.outerHTML = `<p class="cuenta-fin">${fin}</p>`;
      return;
    }
    const s = Math.floor(ms / 1000);
    celdas.d.textContent = Math.floor(s / 86400);
    celdas.h.textContent = String(Math.floor(s % 86400 / 3600)).padStart(2, '0');
    celdas.m.textContent = String(Math.floor(s % 3600 / 60)).padStart(2, '0');
    celdas.s.textContent = String(s % 60).padStart(2, '0');
    setTimeout(tic, 1000 - (Date.now() % 1000));
  }
  tic();

  // Archivo .ics para agregar al calendario
  $('calendario').addEventListener('click', () => {
    const ics = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Invitacion Cesia//ES', 'CALSCALE:GREGORIAN',
      'BEGIN:VEVENT',
      'UID:cumple-cesia-7-20261107@invitacion',
      'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''),
      'DTSTART:20261107T170000Z', 'DTEND:20261107T210000Z',
      'SUMMARY:Cumpleaños de Cesia (7 años)',
      'LOCATION:Finca La Herradura',
      'DESCRIPTION:¡Ven a celebrar este día tan especial!',
      'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:Mañana es el cumple de Cesia', 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR'
    ].join('\r\n');
    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: 'cumple-cesia.ics' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  });

  $('volver').addEventListener('click', () => scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }));
})();
</script>
</body>
</html>
